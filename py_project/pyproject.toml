[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderbridge-ai-engine"
version = "1.0.0"
description = "AI and Predictive Analytics Microservice for TenderBridge Construction & e-Tender Management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]
